name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: ./mvnw --batch-mode verify
      - name: Start the stack with Docker Compose and exercise the main flow
        run: |
          docker compose up --build --detach --wait --wait-timeout 180
          RUN_ID=$(curl --fail --silent -X POST localhost:8080/api/v1/workflow-runs \
            -H 'Content-Type: application/json' -d @examples/order-fulfilment.json | jq -r .id)
          for attempt in $(seq 1 30); do
            STATUS=$(curl --fail --silent "localhost:8080/api/v1/workflow-runs/$RUN_ID" | jq -r .status)
            if [ "$STATUS" = SUCCEEDED ]; then break; fi
            sleep 2
          done
          test "$STATUS" = SUCCEEDED
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
